name: E2E (emulator)

# Runs the app on an Android 15 emulator and stores screenshots / logs in the
# e2e-results branch. Triggered by changing e2e/trigger.
on:
  push:
    paths:
      - "e2e/trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Test media (FLAC + MP3)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p e2e-media
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=20" -ar 48000 -sample_fmt s32 \
            -metadata title="Lossless Test One" -metadata artist="E2E Artist" -metadata album="E2E Lossless Album" \
            e2e-media/lossless_one.flac
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=660:duration=20" \
            -metadata title="Lossless Test Two" -metadata artist="E2E Artist" -metadata album="E2E Lossless Album" \
            e2e-media/lossless_two.flac
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=550:duration=20" -b:a 192k \
            -metadata title="Lossy Test" -metadata artist="E2E Artist" -metadata album="E2E Lossy Album" \
            e2e-media/lossy.mp3
          ls -la e2e-media

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash e2e/run.sh

      - name: Publish results to the e2e-results branch
        if: always()
        run: |
          mkdir -p /tmp/results && cp -r e2e-out/. /tmp/results/ 2>/dev/null || true
          cd /tmp/results
          git init -q && git checkout -q -b e2e-results
          git config user.name "e2e-bot" && git config user.email "e2e-bot@users.noreply.github.com"
          git add -A && git commit -q -m "E2E results for ${GITHUB_SHA}" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" e2e-results

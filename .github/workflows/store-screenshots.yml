name: Store screenshots

# Google Play screenshots (1080x1920, Portuguese and English) with sample music,
# published to the store-screenshots branch. Triggered by changing store/screenshots-trigger.
on:
  push:
    paths:
      - "store/screenshots-trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Sample music with covers (fictional artists)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p store-media covers
          cover() { ffmpeg -loglevel error -y -f lavfi -i "gradients=s=600x600:c0=$2:c1=$3:c2=$4:n=3:type=$5:seed=$6" -frames:v 1 "covers/$1.png"; }
          cover midnight 0xff5e3a 0x7a1f5c 0x1b1464 radial 3
          cover pocket 0x2ec4b6 0x1b4965 0xf6ae2d linear 7
          cover mixtape 0xf9c80e 0xf86624 0xea3546 spiral 11
          song() { # file title artist album cover freq ext
            ffmpeg -loglevel error -y -f lavfi -i "sine=frequency=$6:duration=75" -i "covers/$5.png" \
              -map 0:a -map 1:v -c:v png -disposition:v attached_pic \
              -metadata title="$2" -metadata artist="$3" -metadata album="$4" -metadata album_artist="$3" \
              $( [ "$7" = mp3 ] && echo "-id3v2_version 3 -b:a 256k" ) \
              "store-media/$1.$7"
          }
          song md1 "City Lights" "Neon Tape Club" "Midnight Drive" midnight 440 flac
          song md2 "Rewind" "Neon Tape Club" "Midnight Drive" midnight 494 flac
          song md3 "Side B Summer" "Neon Tape Club" "Midnight Drive" midnight 523 flac
          song md4 "Chrome Hearts" "Neon Tape Club" "Midnight Drive" midnight 587 flac
          song pr1 "Rainy Bus Stop" "Lo-Fi Walkman" "Pocket Radio" pocket 392 mp3
          song pr2 "Old Headphones" "Lo-Fi Walkman" "Pocket Radio" pocket 349 mp3
          song mx1 "Auto Reverse" "The Cassettes" "Mixtape Vol. 1" mixtape 330 flac
          song mx2 "Dolby B" "The Cassettes" "Mixtape Vol. 1" mixtape 370 flac
          ls -la store-media

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take screenshots on a 1080x1920 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: Nexus 5X
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash store/screenshots.sh

      - name: Publish to the store-screenshots branch
        if: always()
        run: |
          mkdir -p /tmp/shots && cp -r store-shots/. /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots
          git init -q && git checkout -q -b store-screenshots
          git config user.name "screenshots-bot" && git config user.email "screenshots-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Store screenshots for ${GITHUB_SHA}" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" store-screenshots
